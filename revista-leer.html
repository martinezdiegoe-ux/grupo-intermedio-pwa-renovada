<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/revista-leer.css?v=39">
  <title>Leer Voz Juvenil · Conectados a Cristo</title>
</head>
<body>
  <header class="reader-header">
    <a class="reader-back" href="voz-juvenil.html" aria-label="Volver a Voz Juvenil">← <span>Voz Juvenil</span></a>
    <h1 id="reader-title">Voz Juvenil</h1>
    <button id="reader-zoom" class="reader-button" type="button" aria-label="Ampliar página">Ampliar</button>

  <main id="reader-stage" class="reader-stage" aria-label="Página de la revista">

    <img id="reader-image" class="reader-image" alt="" draggable="false" hidden>

    <label class="reader-counter">Página <input id="reader-page" type="number" min="1" inputmode="numeric" aria-label="Ir a la página"> <span id="reader-total"></span></label>
    <button id="reader-next" class="reader-button" type="button" aria-label="Página siguiente">Siguiente →</button>
  </nav>
  <script src="js/revista-data.js?v=39"></script>
