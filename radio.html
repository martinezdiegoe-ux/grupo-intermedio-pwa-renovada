<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b38">
  <title>Radio en vivo · Voz Juvenil</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="page-main">
    <section class="page-hero">
      <p class="eyebrow">ESCUCHÁ DONDE ESTÉS</p>
      <h1>Radio en vivo</h1>
      <p>Escuchá la radio de la Asamblea Cristiana mientras recorrés Voz Juvenil.</p>
    </section>
    <div class="panel">
      <h2>Reproductor</h2>
      <div class="radio-frame" style="border:1px solid var(--line)">
        <button type="button" class="radio-launch" data-player-source="radio">▶ Escuchar radio</button>
      </div>
      <p class="empty-note">La radio se abre en un reproductor independiente para que sigas escuchando al cambiar de página.</p>
    </div>
  </main>
  <script src="js/app-shell.js"></script>
</body>
</html>
