<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101b38"><meta name="description" content="Biblioteca digital de libros en PDF del Grupo Intermedio."><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/app.css?v=31"><title>Biblioteca digital · Conectados a Cristo</title><style>
.library-page{max-width:1120px}.library-intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:18px 0}.library-intro h2{font:800 clamp(25px,3vw,34px) Manrope,system-ui,sans-serif;letter-spacing:-.04em;margin:0 0 7px}.library-intro p{font-size:13px;color:var(--muted);margin:0}.library-intro>div{flex:1;min-width:0}.library-page .library-search{width:320px;max-width:100%;flex:0 1 320px}.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.library-book{min-height:230px;display:flex;flex-direction:column;border:1px solid var(--line);background:#fff;border-radius:17px;padding:23px;transition:transform .2s,box-shadow .2s}.library-book:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(26,30,65,.1)}.library-book-icon{display:grid;place-items:center;width:52px;height:60px;background:#eee9ff;color:#6956d4;border-radius:9px 13px 13px 9px;font-size:25px;margin-bottom:22px}.library-book .eyebrow{margin:0 0 8px}.library-book strong{font-size:18px;line-height:1.3}.library-book small{color:var(--muted);font-size:12px;margin:7px 0 16px}.library-book .book-action{margin-top:auto;font-size:13px;font-weight:800;color:var(--violet)}.library-empty{padding:45px;text-align:center}.library-empty .library-book-icon{margin:0 auto 20px}.library-empty h2{font-family:Manrope,system-ui,sans-serif;margin:0 0 10px}.library-empty p{color:var(--muted);line-height:1.6;max-width:500px;margin:0 auto}[data-theme=dark] .library-book{background:var(--surface);border-color:var(--line)}[data-theme=dark] .library-book-icon{background:#3b315c;color:#cbbfff}@media(max-width:800px){.library-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.library-intro{display:block}.library-page .library-search{width:100%;max-width:none;margin-top:18px}.library-grid{grid-template-columns:1fr}}
</style></head><body><main class="page-main library-page"><section class="page-hero"><p class="eyebrow">PARA PROFUNDIZAR</p><h1>Biblioteca digital</h1><p>Libros y materiales en PDF para leer y estudiar a tu ritmo.</p></section><div class="library-intro"><div><h2>Explorá los libros</h2><p id="library-count"></p></div><label class="sr-only" for="library-search">Buscar libros</label><input id="library-search" class="field library-search" type="search" placeholder="Buscar título, autor o tema"></div><div id="library-grid" class="library-grid"></div><div id="library-empty" class="panel library-empty" hidden><span class="library-book-icon" aria-hidden="true">▤</span><h2>Los libros aparecerán acá</h2><p>La biblioteca se irá completando con los PDF autorizados para compartir con el grupo.</p></div><p id="library-no-results" class="empty-note" hidden>No encontramos libros con esa búsqueda.</p></main><script src="js/biblioteca-data.js"></script><script src="js/biblioteca.js"></script><script src="js/i18n-data.js"></script><script src="js/estudios-i18n.js"></script><script src="js/app-shell.js?v=31"></script></body></html>
